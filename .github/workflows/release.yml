name: Release

# Spec V2 (= Cordova V2, for all three packages). Push a `vX.Y.Z` tag on main whose version
# equals every package.json (`node scripts/set-version.mjs X.Y.Z` in the release PR). CI, the
# device e2e gate and both native fixtures re-run on the tag and must pass; then all three
# packages publish together. `-rc.N` goes to the npm `next` dist-tag. Nothing publishes on a
# branch push.
on:
  push:
    tags: ['v*.*.*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Spec Q3: device e2e gate, required on a release tag.
  device-e2e:
    uses: ./.github/workflows/device-e2e.yml

  # Spec V1: fresh Capacitor app + packed packages, `npx cap add`, native build.
  # Release-only (slow native builds); publish waits on both.
  fixture-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Capacitor 8: compile/target SDK 36. Default package list includes the removed 'tools'.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: pnpm install --frozen-lockfile
      - run: scripts/fixture-build.sh android

  fixture-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: scripts/fixture-build.sh ios

  publish:
    needs: [ci, device-e2e, fixture-android, fixture-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write    # GitHub Release at the end of the job
      # npm trusted publishing (OIDC): no NPM_TOKEN. Each package must name this repo and this
      # workflow file as a trusted publisher at npmjs.com > package > Settings.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the on-main check below needs main's history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 / npm >= 11.5.1. No cache: a release build
          # must not restore a warm store.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # The tag is the release's only input. A tag that disagrees with package.json would publish
      # a version nobody asked for. Fail here: a tag is deletable, a published version is not.
      - name: Verify tag matches every package version and is on main
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in core capacitor angular; do
            V="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$TAG" != "$V" ]; then
              echo "::error::tag v$TAG does not match packages/$pkg version $V"
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `pnpm publish` rewrites `workspace:*` to the real version. Prereleases go to `next`, so
      # `npm install` never picks them up.
      - name: Publish to npm
        run: |
          case "$GITHUB_REF_NAME" in *-*) TAG=next ;; *) TAG=latest ;; esac
          pnpm -r --filter './packages/*' publish --access public --provenance --no-git-checks --tag "$TAG"

      # The CHANGELOG section *is* the release notes. `5.0.0-rc.N` uses the `## 5.0.0` section.
      # A missing section gives an empty body rather than failing: npm is already published.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::no CHANGELOG section for $VERSION — empty release body"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md --verify-tag $PRE
