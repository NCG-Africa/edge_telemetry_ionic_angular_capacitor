name: Device e2e

# Spec Q3: the demo/ happy path on an Android emulator and an iOS simulator against mock-ingest.
# Nightly, by hand from the Actions tab, and required by release.yml on a `v*.*.*` tag.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_call:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - run: scripts/demo-build.sh android
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node e2e/device/gate.mjs android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: scripts/demo-build.sh ios
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const ios = Object.keys(d).filter((k) => k.includes("iOS")).sort().reverse();
            console.log(ios.flatMap((k) => d[k]).find((x) => x.name.startsWith("iPhone")).udid);')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - run: node e2e/device/gate.mjs ios
