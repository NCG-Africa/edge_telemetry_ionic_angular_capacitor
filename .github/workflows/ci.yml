name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Terminology check
        run: pnpm terminology-check

      - name: Attribute flatness check
        run: pnpm attribute-flatness-check

      - name: Size check
        run: pnpm size

      - name: Pack audit
        run: pnpm pack-audit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        if: ${{ hashFiles('playwright.config.ts') != '' }}

      - name: Integration tests
        run: pnpm test:integration
        if: ${{ hashFiles('playwright.config.ts') != '' }}

  # Spec V1: fresh Capacitor app + packed packages, `npx cap add`, native build.
  fixture-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: scripts/fixture-build.sh android

  fixture-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: scripts/fixture-build.sh ios
