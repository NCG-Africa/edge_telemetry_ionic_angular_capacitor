name: CI

# Release-only: release.yml calls this on a `v*.*.*` tag before publishing.
# workflow_dispatch allows a manual run from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Terminology check
        run: pnpm terminology-check

      - name: Attribute flatness check
        run: pnpm attribute-flatness-check

      - name: Size check
        run: pnpm size

      - name: Pack audit
        run: pnpm pack-audit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        if: ${{ hashFiles('playwright.config.ts') != '' }}

      - name: Integration tests
        run: pnpm test:integration
        if: ${{ hashFiles('playwright.config.ts') != '' }}

  # Spec Q2: native core JUnit suite (outbox, sender, goldens) on the JVM, no Android host app.
  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Android core tests
        run: gradle -p packages/capacitor/android/core-test test

  # Spec Q2: native core XCTest suite (outbox, sender, goldens) on the macOS host, no iOS host app.
  ios-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: iOS core tests
        run: swift test --package-path packages/capacitor/ios/core-test
