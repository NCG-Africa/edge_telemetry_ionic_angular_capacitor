name: Release

# Push a `v*.*.*` tag on main to publish all packages whose
# package.json version is ahead of npm. Tag-driven, no changesets bot,
# no Version Packages PR — bump versions in your release commit, tag,
# push.
on:
  push:
    tags: ['v*.*.*']

jobs:
  # Spec V1: fresh Capacitor app + packed packages, `npx cap add`, native build.
  # Release-only (slow native builds); publish waits on both.
  fixture-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Capacitor 8: compile/target SDK 36. Default package list includes the removed 'tools'.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: pnpm install --frozen-lockfile
      - run: scripts/fixture-build.sh android

  fixture-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: scripts/fixture-build.sh ios

  publish:
    needs: [fixture-android, fixture-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write    # for GitHub Releases (created by changeset publish)
      id-token: write    # for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must be on the main branch"
            exit 1
          fi

      - name: Publish to npm
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
