name: Release

# Spec V2 (= Cordova V2, for all three packages). Push a `vX.Y.Z` tag on main whose version
# equals every package.json (`node scripts/set-version.mjs X.Y.Z` in the release PR). CI re-runs
# on the tag and must pass. Native fixtures and iOS core tests are local only. Then all three
# packages publish together. `-rc.N` goes to the npm `next` dist-tag. Nothing publishes on a
# branch push.
on:
  push:
    tags: ['v*.*.*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write    # GitHub Release at the end of the job
      # npm trusted publishing (OIDC): no NPM_TOKEN. Each package must name this repo and this
      # workflow file as a trusted publisher at npmjs.com > package > Settings.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the on-main check below needs main's history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 / npm >= 11.5.1. No cache: a release build
          # must not restore a warm store.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # The tag is the release's only input. A tag that disagrees with package.json would publish
      # a version nobody asked for. Fail here: a tag is deletable, a published version is not.
      - name: Verify tag matches every package version and is on main
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in core capacitor angular; do
            PKG="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$VERSION" != "$PKG" ]; then
              echo "::error::tag v$VERSION does not match packages/$pkg version $PKG"
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `pnpm publish` rewrites `workspace:*` to the real version. Prereleases go to `next`, so
      # `npm install` never picks them up.
      - name: Publish to npm
        run: |
          case "$GITHUB_REF_NAME" in *-*) DIST_TAG=next ;; *) DIST_TAG=latest ;; esac
          pnpm -r --filter './packages/*' publish --access public --provenance --no-git-checks --tag "$DIST_TAG"

      # The CHANGELOG section *is* the release notes. `5.0.0-rc.N` uses the `## 5.0.0` section.
      # A missing section gives an empty body rather than failing: npm is already published.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::no CHANGELOG section for $VERSION — empty release body"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md --verify-tag $PRE
